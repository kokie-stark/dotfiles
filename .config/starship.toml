# ~/.config/starship.toml

format = """
$username$directory$git_branch$git_status
$character"""

add_newline = false

[username]
show_always = true
style_user = "bold cyan"
format = "[$user]($style) "

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = ""
style = "bold purple"
format = " [on](fg:#888888) [$branch]($style)"

[git_status]
style = "yellow"
format = " [($all_status$ahead_behind)]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# 表示しないものを全部無効化
[aws]
disabled = true
[gcloud]
disabled = true
[azure]
disabled = true
[python]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[java]
disabled = true
[ruby]
disabled = true
[package]
disabled = true
[cmd_duration]
disabled = true
[time]
disabled = true